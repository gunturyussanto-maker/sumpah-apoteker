<!DOCTYPE html>
<html lang="id">
<head>

<title>Undangan tidak berlaku</title>
<style>
:root{--bg:#EFEAE4;--card:#FAF7F3;--ink:#14233F;--soft:#59627A;--navy:#1B2F55;--taupe:#8B7B6B}

body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;text-align:center}
main{max-width:420px;padding:28px 22px;border:1px solid var(--taupe);border-radius:20px;background:var(--card)}
.rx{font:400 2.4rem Georgia,serif;color:var(--navy)}h1{font:400 1.6rem Georgia,serif;color:var(--navy);margin:8px 0}p{color:var(--soft);margin:0}
.by{margin-top:18px;font-size:.78rem;letter-spacing:.06em}
</style>
</head>
<body>
<main><div class="rx">&#8478;</div><h1>Undangan tidak berlaku</h1><p>Link undangan ini sudah tidak berlaku. Silakan hubungi panitia Sumpah Apoteker.</p><p class="by">Product by <b>gunturs1farm</b></p></main>
</body>
</html>
