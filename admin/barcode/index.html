<style>
:root{--bg:#EFEAE4;--card:#FAF7F3;--ink:#14233F;--soft:#59627A;--navy:#1B2F55;--taupe:#8B7B6B;--line:#D8CFC4;--new:#1E7A4C;--display:Fraunces,Georgia,serif;--body:Figtree,system-ui,sans-serif}

*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding:0 16px 48px}
header{max-width:1100px;margin:0 auto;padding:28px 0 12px}

.sub{color:var(--soft);margin:0}

input[type=search]{flex:1 1 220px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink);padding:9px 12px;font:500 14px var(--body);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--navy);color:var(--card)}
.b{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;font:500 14px var(--body);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.b.pri{background:var(--navy);border-color:var(--navy);color:var(--card)}
.stat{max-width:1100px;margin:0 auto 14px;color:var(--soft);font-size:14px;display:flex;gap:16px;flex-wrap:wrap}
.stat b{color:var(--ink)}
.live{display:inline-flex;align-items:center;gap:6px}.live i{width:8px;height:8px;border-radius:50%;background:var(--new);display:inline-block;animation:p 2s infinite}
@keyframes p{50%{opacity:.3}}
.grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.it{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;position:relative}
.it.baru{border-color:var(--new);box-shadow:0 0 0 2px color-mix(in srgb,var(--new) 25%,transparent)}
.nm{font-weight:600;line-height:1.3}
.tg{font-size:12px;color:var(--soft);display:flex;gap:6px;flex-wrap:wrap}
.tg span{border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.tg .tb{border-color:var(--taupe);color:var(--taupe)}
.tg .nw{border-color:var(--new);color:var(--new);font-weight:600}
.bc{background:#fff;border-radius:8px;padding:6px;display:flex;justify-content:center}
.bc svg{width:100%;height:auto}
.act{display:flex;gap:6px;flex-wrap:wrap}.act .b{padding:6px 10px;font-size:13px}
.empty{max-width:1100px;margin:30px auto;text-align:center;color:var(--soft)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:var(--card);padding:10px 16px;border-radius:999px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:9}
footer{max-width:1100px;margin:28px auto 0;color:var(--soft);font-size:13px;text-align:center}
footer a{color:inherit}
@media (max-width:600px){.bar{position:static}}
@media print{
  body{background:#fff;color:#000;padding:0}
  header .sub,.bar,.stat,.act,footer,#toast{display:none!important}
  header{padding:0 0 6mm}h1{color:#000;font-size:16pt}
  .grid{grid-template-columns:repeat(2,1fr);gap:5mm}
  .it{break-inside:avoid;border:1px solid #999;border-radius:3mm;padding:3mm;box-shadow:none!important;background:#fff}
  .tg span{border-color:#999;color:#333}
}
</style>

<body>
<header>

  <button class="b" type="button" id="csv">Unduh daftar (CSV)</button>
  <a class="b" href="../">← Admin</a>
</div>
<div class="stat"><span>Total <b id="sT">0</b></span><span>Peserta <b id="sP">0</b></span><span>Tambahan <b id="sX">0</b></span><span class="live" id="lv"><i></i> Sinkron otomatis</span></div>

<p class="empty" id="em" hidden>Tidak ada barcode yang cocok.</p>
<footer>Product by gunturs1farm</footer>

<script>
(function(){
var BASE=JSON.parse(document.getElementById('base').textContent);

function $(i){return document.getElementById(i)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}

function png(it){var s=svg(it.kode),x=new XMLSerializer().serializeToString(s),W=+s.getAttribute('width'),H=+s.getAttribute('height'),k=3;
  var img=new Image();img.onload=function(){var c=document.createElement('canvas');c.width=W*k;c.height=H*k;var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
  c.toBlob(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='barcode-'+it.kode.replace(/[^A-Za-z0-9-]+/g,'_')+'.png';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)},'image/png')};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(x)}
function render(){var g=$('g');g.innerHTML='';var q=Q.toLowerCase(),n=0;
  LIST.forEach(function(it){if(F!=='semua'&&it.jenis!==F)return;if(q&&(it.nama+' '+it.kode).toLowerCase().indexOf(q)<0)return;n++;
    var c=el('article','it'+(BARU[it.id]?' baru':''));c.appendChild(el('div','nm',it.nama));
    var tg=el('div','tg');tg.appendChild(el('span',it.jenis==='tambahan'?'tb':'',it.jenis==='tambahan'?'Undangan tambahan':'Peserta'));tg.appendChild(el('span',null,it.kode));if(BARU[it.id])tg.appendChild(el('span','nw','BARU'));c.appendChild(tg);
    var b=el('div','bc');b.appendChild(svg(it.kode));c.appendChild(b);
    var a=el('div','act');var d=el('button','b','Unduh PNG');d.type='button';d.onclick=function(){png(it)};a.appendChild(d);

  var t='﻿'+r.map(function(a){return a.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='barcode-undangan.csv';document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500)};

})();
